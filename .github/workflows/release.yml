name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 2.5.2)'
        required: true
        type: string

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Run tests
      run: dotnet test VoiceLite/VoiceLite.Tests/VoiceLite.Tests.csproj -c Release

  build-installer:
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Extract version from tag or input
      id: version
      shell: pwsh
      run: |
        if ("${{ github.event.inputs.version }}" -ne "") {
          $version = "${{ github.event.inputs.version }}"
        } else {
          $version = "${{ github.ref_name }}" -replace '^v', ''
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        echo "Building version: $version"

    - name: Validate version consistency
      shell: pwsh
      run: |
        $expectedVersion = "${{ steps.version.outputs.VERSION }}"
        $errors = @()

        # Check VoiceLite.csproj
        $csprojPath = "VoiceLite/VoiceLite/VoiceLite.csproj"
        $csprojContent = Get-Content $csprojPath -Raw
        if ($csprojContent -match '<Version>([\d\.]+)</Version>') {
          $csprojVersion = $matches[1]
          if ($csprojVersion -ne $expectedVersion) {
            $errors += "❌ VoiceLite.csproj has version $csprojVersion, expected $expectedVersion"
          } else {
            Write-Host "✓ VoiceLite.csproj version: $csprojVersion" -ForegroundColor Green
          }
        } else {
          $errors += "❌ Could not find version in VoiceLite.csproj"
        }

        # Check VoiceLiteSetup.iss (uses preprocessor directive #define MyAppVersion)
        $issPath = "VoiceLite/Installer/VoiceLiteSetup.iss"
        $issContent = Get-Content $issPath -Raw
        if ($issContent -match '#define MyAppVersion "([\d\.]+)"') {
          $issVersion = $matches[1]
          if ($issVersion -ne $expectedVersion) {
            $errors += "❌ VoiceLiteSetup.iss has version $issVersion, expected $expectedVersion"
          } else {
            Write-Host "✓ VoiceLiteSetup.iss version: $issVersion" -ForegroundColor Green
          }
        } else {
          $errors += "❌ Could not find #define MyAppVersion in VoiceLiteSetup.iss"
        }

        # Check voicelite-web/lib/version.ts (the website serves download links from this constant)
        $webVersionPath = "voicelite-web/lib/version.ts"
        $webVersionContent = if (Test-Path $webVersionPath) { Get-Content $webVersionPath -Raw } else { "" }
        if ($webVersionContent -match "CURRENT_VERSION\s*=\s*'([\d\.]+)'") {
          $webVersion = $matches[1]
          if ($webVersion -ne $expectedVersion) {
            $errors += "❌ voicelite-web/lib/version.ts has CURRENT_VERSION $webVersion, expected $expectedVersion — the website serves download links from this constant, so a mismatch means voicelite.app points users at the wrong installer"
          } else {
            Write-Host "✓ voicelite-web/lib/version.ts version: $webVersion" -ForegroundColor Green
          }
        } else {
          $errors += "❌ Could not find CURRENT_VERSION in voicelite-web/lib/version.ts — the website serves download links from this constant"
        }

        # Fail if any errors
        if ($errors.Count -gt 0) {
          Write-Host ""
          Write-Host "Version Mismatch Detected!" -ForegroundColor Red
          Write-Host "Git tag: v$expectedVersion" -ForegroundColor Yellow
          Write-Host ""
          foreach ($error in $errors) {
            Write-Host $error -ForegroundColor Red
          }
          Write-Host ""
          Write-Host "Fix: manually bump <Version> in VoiceLite/VoiceLite/VoiceLite.csproj," -ForegroundColor Yellow
          Write-Host "#define MyAppVersion in VoiceLite/Installer/VoiceLiteSetup.iss and" -ForegroundColor Yellow
          Write-Host "CURRENT_VERSION in voicelite-web/lib/version.ts to match the tag." -ForegroundColor Yellow
          exit 1
        }

        Write-Host ""
        Write-Host "✓ All versions match tag v$expectedVersion" -ForegroundColor Green
        Write-Host ""

    - name: Restore dependencies
      run: dotnet restore VoiceLite/VoiceLite.sln

    - name: Build Release
      run: dotnet publish VoiceLite/VoiceLite/VoiceLite.csproj -c Release -r win-x64 --self-contained

    - name: Copy Silero VAD to publish directory
      shell: pwsh
      run: |
        # v2.0+ ships only the Silero VAD ONNX (~2.3MB) in the installer.
        # The Parakeet v3 speech model (~640MB) downloads on first launch.
        $sileroSrc = "VoiceLite/whisper/silero_vad_v5.onnx"
        if (-not (Test-Path $sileroSrc)) {
          Write-Host "ERROR: $sileroSrc not found — installer would ship without VAD" -ForegroundColor Red
          exit 1
        }

        echo "Copying Silero VAD to publish directory..."

        $publishDir = "VoiceLite/VoiceLite/bin/Release/net8.0-windows/win-x64/publish/whisper"
        New-Item -ItemType Directory -Force -Path $publishDir

        Copy-Item -Path $sileroSrc -Destination $publishDir -Force

        echo "Copied files to publish directory:"
        Get-ChildItem $publishDir | ForEach-Object {
          $sizeInMB = [math]::Round($_.Length / 1MB, 2)
          echo "  - $($_.Name) ($sizeInMB MB)"
        }

    - name: Download VC++ Redistributable
      shell: pwsh
      run: |
        $vcRedistUrl = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
        $vcRedistPath = "VoiceLite/Installer/vc_redist.x64.exe"

        echo "Downloading VC++ Redistributable..."
        Invoke-WebRequest -Uri $vcRedistUrl -OutFile $vcRedistPath

        $sizeInMB = [math]::Round((Get-Item $vcRedistPath).Length / 1MB, 2)
        echo "Downloaded VC++ Redistributable ($sizeInMB MB)"

    - name: Install Inno Setup
      shell: pwsh
      run: |
        # v2.2.0: direct download from jrsoftware.org started returning corrupt
        # files (HTML instead of the exe). Chocolatey is preinstalled on
        # windows-latest runners and installs to the same Program Files path.
        # Version pinned for reproducibility/supply-chain safety — bump deliberately
        # (latest on community.chocolatey.org as of 2026-07-17: 6.7.1).
        choco install innosetup --version=6.7.1 --yes --no-progress

        $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $isccPath)) {
          echo "ERROR: Inno Setup not found at $isccPath after choco install"
          exit 1
        }
        echo "Inno Setup installed"

    - name: Compile installer
      shell: pwsh
      run: |
        $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

        if (-not (Test-Path $isccPath)) {
          echo "ERROR: Inno Setup not found at $isccPath"
          exit 1
        }

        echo "Compiling installer with Inno Setup..."
        & $isccPath "VoiceLite\Installer\VoiceLiteSetup.iss"

        if ($LASTEXITCODE -ne 0) {
          echo "ERROR: Installer compilation failed"
          exit 1
        }

        echo "Installer compiled successfully"

    - name: Generate SHA256 hashes
      id: generate-hashes
      shell: pwsh
      run: |
        echo "Generating SHA256 hashes for installers..."

        $installers = Get-ChildItem -Path . -Filter "VoiceLite-Setup-*.exe" -Recurse
        $hashes = @()

        foreach ($installer in $installers) {
          $hash = Get-FileHash -Path $installer.FullName -Algorithm SHA256
          $sizeInMB = [math]::Round($installer.Length / 1MB, 2)

          echo "File: $($installer.Name) ($sizeInMB MB)"
          echo "SHA256: $($hash.Hash)"
          echo ""

          $hashes += "**$($installer.Name)** ($sizeInMB MB)`n``````text`n$($hash.Hash)`n```````n"
        }

        # Save hashes to output for release notes
        $hashesContent = $hashes -join "`n"
        # Multi-line output needs the heredoc form; the old %0A escaping was for the
        # retired set-output command and showed up literally in the release notes.
        $delimiter = "HASHES_EOF_$([guid]::NewGuid().ToString('N'))"
        "HASHES<<$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        $hashesContent      | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        $delimiter          | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: List installer files
      shell: pwsh
      run: |
        echo "Installer files created:"
        Get-ChildItem -Path . -Filter "VoiceLite-Setup-*.exe" -Recurse | ForEach-Object {
          $sizeInMB = [math]::Round($_.Length / 1MB, 2)
          echo "  - $($_.FullName) ($sizeInMB MB)"
        }

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.VERSION }}
        name: VoiceLite v${{ steps.version.outputs.VERSION }}
        draft: false
        prerelease: false
        files: |
          VoiceLite-Setup-*.exe
        body: |
          ## VoiceLite v${{ steps.version.outputs.VERSION }}

          ### What's New
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for what changed in this release.

          ### Updating from an earlier version
          - **On 2.5.1 or later**: use the **Update available** banner in the app. It downloads this installer, checks its SHA-256 and installs it for you. If Windows asks for permission during the update, click **Yes**. If VoiceLite does not reopen by itself afterwards, start it from the Start menu.
          - **On 2.5.0 or older**: download and run the installer below. Your settings, license and speech model are kept.

          ### Download
          - **VoiceLite-Setup-${{ steps.version.outputs.VERSION }}.exe**
            - .NET 8 bundled (self-contained, no separate install needed)
            - VC++ Runtime bundled (25MB, auto-installs silently)
            - Silero VAD model bundled (~2.3MB)
            - **Parakeet v3 speech model downloads on first launch (~640MB)** — needs an internet connection at first run

          ### Installation Steps
          1. Download the installer
          2. Optional: check the download (see "Verify your download" below)
          3. Right-click installer → Properties → **Unblock** (if shown)
          4. Run the installer - dependencies auto-install silently
          5. Accept EULA and complete installation
          6. Launch VoiceLite — first-launch screen downloads the speech model (~640MB)
          7. Once download completes, you're ready to dictate

          ### System Requirements
          - Windows 10/11 (64-bit)
          - ~1 GB free disk space (installer + first-launch model download)
          - Microphone (built-in or USB)
          - Internet connection for first launch (for model download); offline after that
          - **All dependencies bundled** — VC++ Runtime and .NET 8 install automatically

          ### Verify your download (optional)
          The in-app updater does this automatically. For a manual download:

          ```powershell
          Get-FileHash VoiceLite-Setup-*.exe -Algorithm SHA256
          ```

          Compare the result with the checksum listed below. A mismatch means the download is corrupted — download it again.

          ### SHA256 Hashes
          ${{ steps.generate-hashes.outputs.HASHES }}

          ### Troubleshooting
          - **Antivirus blocking**: Add VoiceLite.exe to antivirus exclusions
          - **Speech model download fails**: Check your internet connection, then exit VoiceLite from the tray icon and start it again to retry
          - **VC++ install fails**: Installer auto-installs VC++ Runtime - if it fails, manually download from [Microsoft](https://aka.ms/vs/17/release/vc_redist.x64.exe)
          - **An update did not complete**: Setup leaves a `Setup Log <date>.txt` file in your `%TEMP%` folder — include it when you contact support

          ---

          🤖 Auto-generated release via GitHub Actions
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload installer artifact
      uses: actions/upload-artifact@v4
      with:
        name: VoiceLite-Installer-v${{ steps.version.outputs.VERSION }}
        path: VoiceLite-Setup-*.exe
        retention-days: 90
